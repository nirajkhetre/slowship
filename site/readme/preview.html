<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>README preview</title>
<!-- the README as GitHub draws it, near enough: its markdown stylesheet, its column width, light or dark from the system -->
<base href="../../">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">
<style>
  body { margin: 0; background: #ffffff; } @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
  .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 32px 45px; }
  @media (max-width: 767px) { .markdown-body { padding: 16px; } }
</style></head>
<body><article class="markdown-body" id="md"></article>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch('README.md').then(r => r.text()).then(t => {
    md.innerHTML = marked.parse(t, { gfm: true });
    for (const h of md.querySelectorAll('h1, h2, h3')) h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]/g, '').replace(/ /g, '-');  // GitHub's anchors
  });
</script>
</body></html>
